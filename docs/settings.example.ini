# Every setting Reminders reads, with its default, commented out.
# Copy to ~/.config/reminders/settings.ini (or $XDG_CONFIG_HOME/reminders/),
# then uncomment and change what you need. Shared by the GNOME app (main
# menu → Settings… opens it; saved changes apply straight away) and the
# terminal client (`S` in the TUI opens it in your editor).
#
# Keep the [general] line: settings outside it are ignored. Comments go on
# their own lines; a # after a value becomes part of the value.

[general]

# ── Source ──────────────────────────────────────────────────────────────
# The [source.NAME] new lists go into by default (see the end of this
# file); without it, the first source. Default Source in the app's Source
# Info… sets it; `reminders folder PATH` sets this source's folder.
#default-source=personal

# The view that last had focus, shared by the app, TUI and CLI; updated as
# you move around. One of: today, scheduled, all, all-reminders, flagged, completed,
# list:NAME or tag:NAME.
#view=today

# Whether the sidebar is shown (Ctrl+B in either app). Saved as you toggle
# it; the app only saves it while its window is wide enough to show the
# sidebar beside the reminders.
#show-sidebar=true

# ── Key numbers ─────────────────────────────────────────────────────────
# Label the first ten sidebar entries with their jump key (Ctrl+1…Ctrl+0 in
# the app, (1)…(0) in the terminal). true/false, yes/no, 1/0, on/off.
# --show-key-numbers / --hide-key-numbers override it for one run.
#show-key-numbers=false

# ── Sidebar groups ──────────────────────────────────────────────────────
# Order of the groups. A group left out or misspelled goes at the end.
# Your lists are one group per source: lists:NAME places one, my-lists
# stands for the sources not named (with one source, its only group).
# Also changed by Move Up/Down (right-click a heading) or Alt+Shift+Up/Down.
#sidebar-order=smart-lists, my-lists, tags
#sidebar-order=lists:work, smart-lists, lists:home, tags

# Which smart lists to show, in this order: today, scheduled, all,
# all-reminders (open and completed), flagged, completed. "none" shows none of them. Hiding a smart list from
# its right-click menu in the app takes it out of this line.
#smart-lists=today, scheduled, all, all-reminders, flagged, completed

# The order of the tags: these first, the rest alphabetically after them.
# Move Up / Move Down on a tag in the app (or Alt+Up/Down) rewrites it, as
# they rewrite smart-lists for the smart lists.
#tags-order=work, errands

# The order of your lists on this computer: these first, then the rest in
# their usual order. Alt+Up/Down on a list (or Move Up/Down) rewrites it.
# Lists are named source/name (a bare name works when only one source has
# a list of that name).
#lists-order=personal/Groceries, personal/Work, "personal/Smith, Jo"

# Your lists and tags hidden from the sidebar (Hide in their right-click
# menu in the app). Comma-separated; quote a name with a comma in it.
#lists-hidden=personal/Work, "personal/Smith, Jo"
#tags-hidden=errands, frontend

# Show the hidden smart lists, lists and tags anyway, dimmed (the app's
# main menu: Show Hidden Lists).
#show-hidden=false

# A tag's colour and icon in the sidebar (Tag Info… in the app). Colours:
# red orange yellow green cyan blue indigo purple pink brown gray. Icons: as
# for lists (see docs/FORMAT.md); the default is gray and "tag".
#tag-color.errands=orange
#tag-icon.errands=cart

# How each group appears:
#   visible      shown; plain heading, except the top group, which has none
#   collapsible  under a heading that folds/unfolds the group ("collapsable" also works)
#   hidden       not shown (not allowed for my-lists)
#smart-lists-display=visible
#my-lists-display=visible
#tags-display=visible

# Whether a collapsible group is folded. Set by the apps when you fold or
# unfold one; ignored unless that group is collapsible.
#smart-lists-collapsed=false
#lists-collapsed.personal=false
#tags-collapsed=false

# ── Sources ─────────────────────────────────────────────────────────────
# One section per source: its back end and that back end's settings.
#   backend=syncthing  the folder is synced by Syncthing: conflict copies are
#                      merged, using per-device records in <folder>/.reminders/
#                      (kept out of the sync through .stignore)
#   backend=local      just the folder: files are read and saved as they are
# Add Source… / `reminders folder PATH` pick the back end themselves:
# syncthing inside a Syncthing folder (one with .stfolder), else local.
#
# title= is the heading of the source's sidebar group (default: the name,
# capitalised). Several sources are open at once. In the app, ☰ → Sources…
# adds, edits (Source Info…) and removes them.
#
#[source.personal]
#backend=syncthing
#folder=/home/you/Sync/Reminders
#title=Personal
